[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "UP017",  # datetime.UTC es 3.11+; timezone.utc es más explícito al leerlo
    "UP042",  # str+Enum: lo queremos, serializa directo a JSON
    "B008",   # Depends() en el default es el patrón oficial de FastAPI
]

[tool.coverage.run]
source = ["app"]
# El cliente de la YouTube Data API y el publicador real son el resto de US-C3
# (videos.insert); el flujo OAuth de app/oauth/ ya se mide.
omit = ["app/oauth/youtube_client.py", "app/infra/publishers/youtube.py"]
