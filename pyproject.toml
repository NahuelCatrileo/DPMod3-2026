[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "UP017",  # datetime.UTC es 3.11+; timezone.utc es más explícito al leerlo
    "UP042",  # str+Enum: lo queremos, serializa directo a JSON
    "B008",   # Depends() en el default es el patrón oficial de FastAPI
]

[tool.coverage.run]
source = ["app"]
# El cliente de la YouTube Data API es una envoltura fina de googleapiclient;
# el flujo OAuth y el publicador real ya se miden con sus pruebas.
omit = ["app/oauth/youtube_client.py"]
