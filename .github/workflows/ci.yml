name: CI - PubTube Modulo 3

on:
  push:
    branches: [main, develop, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-integration:
    name: Test, build and smoke-test M3 through Gateway
    runs-on: ubuntu-latest
    env:
      MODULE_PORT: "8003"
      GATEWAY_SMOKE_PATH: /api/publish/health
      GATEWAY_IMAGE: ghcr.io/tilininsano312/pubtube-mod4:develop
      IMAGE: ghcr.io/nahuelcatrileo/dpmod3-2026:develop
      JWT_SECRET: module-ci-only-secret-change-this-value
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/test.db
      PUBLISHER_MODE: mock
      EVENT_TRANSPORT: log
      MOCK_LATENCY_SECONDS: "0"
      SCHEDULER_ENABLED: "false"
      SESSION_SECRET_KEY: module3-ci-session-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - uses: docker/setup-buildx-action@v3

      - name: Build module image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pubtube-module-under-test:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start module and Gateway
        run: |
          docker network create it-net

          # ADR-0007: el módulo emite los tokens y el gateway los valida con la
          # misma clave. Se registra un cliente solo para este run.
          cred="$(docker run --rm pubtube-module-under-test:ci \
            python scripts/generar_cliente.py --client-id module-ci)"
          client_secret="$(echo "$cred" | awk '/^client_secret:/ {print $2}')"
          echo "::add-mask::$client_secret"
          echo "CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          auth_clients="$(echo "$cred" | sed -n "s/^AUTH_CLIENTS='\(.*\)'$/\1/p")"

          docker run -d --name module-under-test --network it-net \
            -p "$MODULE_PORT:$MODULE_PORT" \
            -e PORT="$MODULE_PORT" -e APP_ENV -e DATABASE_URL \
            -e PUBLISHER_MODE -e EVENT_TRANSPORT -e MOCK_LATENCY_SECONDS \
            -e SCHEDULER_ENABLED -e SESSION_SECRET_KEY \
            -e JWT_SECRET_KEY="$JWT_SECRET" -e AUTH_CLIENTS="$auth_clients" \
            pubtube-module-under-test:ci

          docker run -d --name gateway-under-test --network it-net \
            -p 8000:8000 \
            -e GATEWAY_PORT=8000 -e JWT_SECRET -e JWT_ALGORITHM=HS256 \
            -e MODULE3_URL="http://module-under-test:$MODULE_PORT" \
            "$GATEWAY_IMAGE"

      - name: Smoke-test M3 through Gateway
        run: |
          retry=(--retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors
                 --retry-max-time 90 --fail --silent --show-error --output /dev/null)

          curl "${retry[@]}" http://127.0.0.1:8000/api/health

          token="$(docker exec gateway-under-test python -c \
            'import os,time,jwt; print(jwt.encode({"sub":"module-ci","user_id":"module-ci","role":"admin","exp":int(time.time())+300}, os.environ["JWT_SECRET"], algorithm="HS256"))')"

          curl "${retry[@]}" \
            -H "Authorization: Bearer $token" \
            -H "X-Correlation-Id: module-ci-${GITHUB_RUN_ID}" \
            "http://127.0.0.1:8000$GATEWAY_SMOKE_PATH"

          # ADR-0007: token emitido por M3, validado por el gateway y por M3.
          set -o pipefail
          curl "${retry[@]}" "http://127.0.0.1:$MODULE_PORT/health"
          m3_token="$(curl --fail --silent --show-error \
            -d grant_type=client_credentials -d client_id=module-ci \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            "http://127.0.0.1:$MODULE_PORT/api/auth/token" | jq -r .access_token)"
          schedule_at="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          publish_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $m3_token" -H "Content-Type: application/json" \
            -d "{\"contentId\":\"module-ci-${GITHUB_RUN_ID}\",\"scheduleAt\":\"$schedule_at\",\"timezone\":\"UTC\"}" \
            http://127.0.0.1:8000/api/publish/schedule | jq -r .publishId)"
          curl --fail --silent --show-error --output /dev/null \
            -H "Authorization: Bearer $m3_token" \
            "http://127.0.0.1:8000/api/publish/$publish_id/status"

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs module-under-test || true
          docker logs gateway-under-test || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish M3 image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha