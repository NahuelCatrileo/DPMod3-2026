services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pubtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubtube}
      POSTGRES_DB: ${POSTGRES_DB:-pubtube_m3}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pubtube}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Broker local para desarrollar sin depender del Equipo B.
  # Cuando su exchange esté operativo, apunten AMQP_URL allá y bajen este.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  module3:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migraciones antes de arrancar: el clon limpio debe funcionar sin
    # pasos manuales (Guía §4.4).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tests:
    build: .
    env_file: .env
    environment:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/test.db
      SCHEDULER_ENABLED: "false"
      EVENT_TRANSPORT: log
      MOCK_LATENCY_SECONDS: "0"
    profiles: ["tools"]
    command: pytest -v --cov=app --cov-report=term-missing

volumes:
  pg_data:
  rabbitmq_data:
